name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Prachurjo Calculator APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Make Gradle executable
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          gradle --version

      # 5. Fix missing launcher resources
      - name: Create missing launcher resources
        working-directory: android
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v21

          cat > app/src/main/res/mipmap-anydpi-v21/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#2196F3"
                  android:pathData="M18,18h72v72h-72z" />
          </vector>
          EOF

          cp app/src/main/res/mipmap-anydpi-v21/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v21/ic_launcher_round.xml

      # 6. Check Android project
      - name: Verify Android project
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android project structure OK"

      # 7. Clean
      - name: Clean project
        working-directory: android
        run: |
          gradle clean --stacktrace --no-daemon

      # 8. Build REAL Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # 9. Verify APK exists
      - name: Verify APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find app/build -type f | sort || true
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"
          file "$APK"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prachurjo-Calculator
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
