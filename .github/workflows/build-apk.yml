name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Calculator APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Prepare Gradle
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          gradle --version

      # 5. Add Calculator Logo
      - name: Setup Calculator Logo
        working-directory: android
        run: |
          if [ ! -f "../assets/calculator_logo.png" ]; then
            echo "ERROR: assets/calculator_logo.png not found!"
            exit 1
          fi

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          convert "../assets/calculator_logo.png" -resize 48x48 \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "../assets/calculator_logo.png" -resize 72x72 \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "../assets/calculator_logo.png" -resize 96x96 \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "../assets/calculator_logo.png" -resize 144x144 \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "../assets/calculator_logo.png" -resize 192x192 \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp app/src/main/res/mipmap-mdpi/ic_launcher.png \
             app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp app/src/main/res/mipmap-hdpi/ic_launcher.png \
             app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png \
             app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
             app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      # 6. Verify Android Project
      - name: Verify Android project
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure OK"

      # 7. Clean
      - name: Clean project
        working-directory: android
        run: |
          gradle clean --stacktrace --no-daemon

      # 8. Build Debug APK
      - name: Build Calculator APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # 9. Verify APK
      - name: Verify APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find app/build -type f | sort || true
            exit 1
          fi

          echo "======================================"
          echo "CALCULATOR APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"
          file "$APK"

      # 10. Rename APK to Calculator.apk
      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/Calculator.apk

          ls -lh release/Calculator.apk

      # 11. Upload Direct APK Artifact
      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: release/Calculator.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 12. Create GitHub Release
      - name: Create Calculator Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "calculator-${{ github.run_number }}"
          name: "Calculator APK ${{ github.run_number }}"
          body: |
            # Calculator

            Calculator APK built successfully.

            ## Download
            Download `Calculator.apk` from the Assets section below.
          files: release/Calculator.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
